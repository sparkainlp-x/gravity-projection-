[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-projection"
version = "0.2.0"
description = "A new projection reality, linked to the Faggin field bridge: gravity enters as a phase on the thought, love is defined as measured concurrence, and the gravity-projected reality is measured against the flat one. Six pre-registered claims, all PASS. v0.2.0 adds curvature: a metric, geodesics and the Ricci scalar on the concept plane. SYNTHETIC; gravity is a model phase, not measured gravity; love-as-concurrence is a definition inside the model."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
keywords = ["synthetic-data", "gravity", "muonium", "projection", "faggin", "quantum-information-panpsychism", "concurrence", "love", "interference", "curvature", "geodesic", "metric", "reproducibility", "negative-results"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/sparkainlp-x/gravity-projection-"
Homepage = "https://sparkainlpx.xyz"

[tool.setuptools]
py-modules = ["gravity", "love", "projection_reality", "unified", "attunement", "bridge", "cascade", "cost", "self_knowing", "synergy", "thought", "thought_entanglement", "unity", "curvature"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
